<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Emulador NES Demo</title>
<style>
 body { background:#000; color:#fff; font-family:sans-serif; font-size:24px; text-align:center; }
 canvas { background:#111; image-rendering:pixelated; }
 #controls { margin-top:20px; }
</style>
</head>
<body>
<h1>Emulador NES (Demo)</h1>
<input type="file" id="romfile" accept=".nes"><br>
<canvas id="screen" width="256" height="240" style="width:512px;height:480px;"></canvas>
<div id="controls">
<p>Controles: Flechas = Direcciones, Z = Botón A, X = Botón B, Enter = Start, Shift = Select.</p>
</div>
<script>
(function(){
const WIDTH=256, HEIGHT=240;
const canvas=document.getElementById('screen');
const ctx=canvas.getContext('2d');
ctx.font='20px sans-serif';

function CPU(){
  this.mem=new Uint8Array(0x10000);
  this.pc=0x8000;
  this.a=0;this.x=0;this.y=0;this.sp=0xfd;this.status=0x24;
}
CPU.prototype.reset=function(){ this.pc= (this.mem[0xFFFD]<<8)|this.mem[0xFFFC]; };
CPU.prototype.loadPRG=function(prg){
  for(let i=0;i<prg.length;i++) this.mem[0x8000+i]=prg[i];
  this.mem[0xFFFC]=0x00; this.mem[0xFFFD]=0x80;
  this.reset();
};
CPU.prototype.step=function(){
  const op=this.mem[this.pc++];
  switch(op){
    case 0xEA: /*NOP*/ break;
    case 0xA9: /*LDA #imm*/ this.a=this.mem[this.pc++]; break;
    case 0x8D: /*STA abs*/ const lo=this.mem[this.pc++]; const hi=this.mem[this.pc++]; this.mem[(hi<<8)|lo]=this.a; break;
    case 0x4C: /*JMP abs*/ const l=this.mem[this.pc++]; const h=this.mem[this.pc++]; this.pc=(h<<8)|l; break;
    case 0x00: return false; /*BRK*/
    default: return false;
  }
  return true;
};

const cpu=new CPU();
let running=false;
function frame(){
  if(running){
    for(let i=0;i<1000;i++) if(!cpu.step()) {running=false;break;}
  }
  // simple visualize memory value at $0200 as color
  const color=cpu.mem[0x0200]||0;
  ctx.fillStyle='rgb('+color+',0,0)';
  ctx.fillRect(0,0,WIDTH,HEIGHT);
  ctx.fillStyle='#0f0';
  ctx.fillText('ROM ejecutándose...',20,40);
  requestAnimationFrame(frame);
}

function loadDefault(){
  const b64=defaultRom;
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const prg=arr.slice(16,16+16384);
  cpu.loadPRG(prg); running=true;
}

document.getElementById('romfile').addEventListener('change',function(e){
  const f=e.target.files[0];
  if(!f){loadDefault();return;}
  const r=new FileReader();
  r.onload=function(){
    const arr=new Uint8Array(r.result);
    const prg=arr.slice(16,16+16384);
    cpu.loadPRG(prg); running=true;
  };
  r.readAsArrayBuffer(f);
});

window.addEventListener('gamepadconnected',function(){console.log('Gamepad conectado');});
window.addEventListener('load',function(){ loadDefault(); frame(); });

const defaultRom=`
